<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Час">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Облік часу</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14181c;
    --card: #1a2025;
    --line: #262e35;
    --text: #e9edf0;
    --muted: #8b969f;
    --green: #2fb36a;
    --red: #e5483f;
    --amber: #e0a73a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0);
  }

  /* ---------- Вкладки ---------- */
  .view {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }
  .view > * { flex-shrink: 0; }
  .view.active { display: flex; }
  #viewTrack { justify-content: center; gap: 22px; }
  #viewStats { justify-content: flex-start; gap: 16px; padding-top: 24px; }
  #info { text-align: center; padding: 6px 16px 10px; }
  #tabs {
    display: flex;
    border-top: 1px solid var(--line);
    background: #171c21;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  #tabs button {
    flex: 1;
    padding: 15px 0 14px;
    background: none;
    border: 0;
    border-top: 3px solid transparent;
    margin-top: -1px;
    color: var(--muted);
    font: inherit;
    font-size: .95rem;
    cursor: pointer;
  }
  #tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-top-color: var(--green); }
  #tabs button:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

  /* ---------- Головний екран ---------- */
  #status { font-size: 1.25rem; font-weight: 600; text-align: center; }
  #btn {
    width: min(62vw, 260px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 1.5rem;
    font-weight: 700;
    box-shadow: 0 0 0 10px rgba(47, 179, 106, .18), 0 14px 40px rgba(0, 0, 0, .45);
    transition: background .25s, box-shadow .25s, transform .1s, opacity .2s;
    cursor: pointer;
  }
  #btn:active { transform: scale(.96); }
  #btn:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
  #btn.working {
    background: var(--red);
    box-shadow: 0 0 0 10px rgba(229, 72, 63, .18), 0 14px 40px rgba(0, 0, 0, .45);
  }
  #btn:disabled { opacity: .65; }
  #timer { font-size: 2.6rem; font-variant-numeric: tabular-nums; font-weight: 300; min-height: 1.2em; }
  #todayLine { color: var(--muted); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  #sync { color: var(--muted); font-size: .9rem; min-height: 1.2em; text-align: center; }
  #sync.pending { color: var(--amber); }
  #note { font-size: .95rem; min-height: 1.2em; max-width: 30em; margin: 0 auto; text-align: center; color: var(--amber); }
  #note.error { color: var(--red); }

  /* ---------- Статистика ---------- */
  #stats, #calCard {
    width: min(92vw, 420px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  #stats { padding: 2px 16px; }
  #stats .row {
    display: grid;
    grid-template-columns: 1fr auto 4.6em;
    gap: 10px;
    align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid #242c33;
  }
  #stats .row:last-child { border-bottom: 0; }
  #stats .lbl { font-size: .95rem; }
  #stats .lbl small { display: block; color: var(--muted); font-size: .75rem; margin-top: 1px; }
  #stats .val { font-size: 1.1rem; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  #stats .row.main .val { font-size: 1.3rem; }
  #stats .val small { display: block; color: var(--muted); font-size: .75rem; font-weight: 400; margin-top: 1px; }
  #stats .days { color: var(--muted); font-size: .85rem; text-align: right; }

  #calCard { padding: 12px; }
  #calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #calHead button {
    background: none;
    border: 0;
    color: var(--text);
    font: inherit;
    font-size: 1.5rem;
    line-height: 1;
    padding: 6px 16px;
    cursor: pointer;
  }
  #calHead button:disabled { color: #3a454e; cursor: default; }
  #calTitle { font-weight: 600; }
  #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { text-align: center; color: var(--muted); font-size: .72rem; padding: 2px 0 4px; }
  .day {
    aspect-ratio: 1 / 1.05;
    border-radius: 8px;
    border: 0;
    background: #20272d;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font: inherit;
    padding: 0;
    cursor: pointer;
  }
  .day .n { font-size: .78rem; opacity: .85; }
  .day .h { font-size: .7rem; font-variant-numeric: tabular-nums; font-weight: 600; min-height: .9em; }
  .day.blank { background: none; pointer-events: none; }
  .day.today { box-shadow: inset 0 0 0 2px #fff; }
  .day:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  #calSummary { margin-top: 10px; text-align: center; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  #settingsBtn {
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    font-size: .9rem;
    padding: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---------- Діалоги ---------- */
  dialog {
    background: #1d2329;
    color: var(--text);
    border: 1px solid #2c353d;
    border-radius: 14px;
    width: min(92vw, 420px);
    max-height: 88vh;
    padding: 20px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h2 { margin: 0 0 14px; font-size: 1.15rem; text-transform: capitalize; }
  dialog label { display: block; margin: 12px 0 4px; font-size: .9rem; color: var(--muted); }
  dialog input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid #3a454e;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 1rem;
  }
  dialog .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  dialog button {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #3a454e;
    background: #29323a;
    color: var(--text);
    font: inherit;
    font-size: .88rem;
    cursor: pointer;
  }
  dialog button.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  dialog button.danger { background: transparent; border-color: #5a2a27; color: var(--red); margin-right: auto; }
  .err { color: var(--red); font-size: .9rem; min-height: 1.2em; margin-top: 8px; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  #dayList { max-height: 50vh; overflow-y: auto; }
  .shiftRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #2c353d;
  }
  .shiftRow .t { font-size: 1.05rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  .shiftRow .m { color: var(--muted); font-size: .85rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 8px 0; }
  .totalRow { padding-top: 10px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<main id="viewTrack" class="view active" role="tabpanel" aria-labelledby="tabTrack">
  <div id="status"></div>
  <button id="btn" type="button"></button>
  <div id="timer"></div>
  <div id="todayLine"></div>
</main>

<section id="viewStats" class="view" role="tabpanel" aria-labelledby="tabStats">
  <div id="stats" aria-label="Статистика"></div>
  <div id="calCard">
    <div id="calHead">
      <button id="calPrev" type="button" aria-label="Попередній місяць">‹</button>
      <div id="calTitle"></div>
      <button id="calNext" type="button" aria-label="Наступний місяць">›</button>
    </div>
    <div id="calGrid"></div>
    <div id="calSummary"></div>
  </div>
  <button id="settingsBtn" type="button">Налаштування</button>
</section>

<div id="info">
  <div id="sync"></div>
  <div id="note" role="status"></div>
</div>

<nav id="tabs" role="tablist">
  <button id="tabTrack" type="button" role="tab" aria-selected="true">Облік</button>
  <button id="tabStats" type="button" role="tab" aria-selected="false">Статистика</button>
</nav>

<dialog id="dlg">
  <h2>Налаштування</h2>
  <label for="cfgUrl">Адреса веб-застосунку (…/exec)</label>
  <input id="cfgUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="cfgToken">Токен</label>
  <input id="cfgToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="cfgRate">Вартість робочої години, ₴</label>
  <input id="cfgRate" type="text" inputmode="decimal" autocomplete="off" placeholder="наприклад, 150">
  <div class="hint">Ставка зберігається лише на цьому телефоні. Суми в статистиці рахуються за поточною ставкою.</div>
  <div id="cfgError" class="err"></div>
  <div class="row">
    <button id="cfgCancel" type="button">Скасувати</button>
    <button id="cfgSave" type="button" class="primary">Зберегти</button>
  </div>
</dialog>

<dialog id="dayDlg">
  <h2 id="dayTitle"></h2>
  <div id="dayList"></div>
  <div class="row">
    <button id="dayAdd" type="button">Додати зміну</button>
    <button id="dayClose" type="button" class="primary">Закрити</button>
  </div>
</dialog>

<dialog id="editDlg">
  <h2 id="editTitle"></h2>
  <label for="editStart">Початок</label>
  <input id="editStart" type="datetime-local">
  <label for="editEnd">Кінець</label>
  <input id="editEnd" type="datetime-local">
  <div id="editHint" class="hint"></div>
  <div id="editError" class="err"></div>
  <div class="row">
    <button id="editDelete" type="button" class="danger">Видалити</button>
    <button id="editCancel" type="button">Скасувати</button>
    <button id="editSave" type="button" class="primary">Зберегти</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  const LS = { cfg: 'wt_cfg', queue: 'wt_queue', shifts: 'wt_shifts2', oldShifts: 'wt_shifts' };
  const $ = id => document.getElementById(id);
  const btn = $('btn'), statusEl = $('status'), timerEl = $('timer'), todayLineEl = $('todayLine');
  const statsEl = $('stats'), syncEl = $('sync'), noteEl = $('note');
  const calTitleEl = $('calTitle'), calGridEl = $('calGrid'), calSummaryEl = $('calSummary');
  const dlg = $('dlg'), dayDlg = $('dayDlg'), editDlg = $('editDlg');
  const FUTURE_MS = 5 * 60 * 1000; // така ж терпимість, як на сервері

  const NOTES = {
    already_open: 'У таблиці вже була відкрита зміна — перевір колонку «Кінець» у листі «Лог».',
    no_open_shift: 'У таблиці немає відкритої зміни, тому «Кінець» не записано. Перевір лист «Лог».',
    out_before_start: 'Час завершення раніше за початок — подію не записано. Перевір лист «Лог».',
    bad_time: 'Час події в майбутньому — подію не записано. Перевір годинник телефона.',
    bad_event: 'Сервер відхилив подію як некоректну.',
    not_found: 'Зміну не знайдено в таблиці (можливо, її видалили) — правку не застосовано.'
  };
  const ERRORS = {
    auth: 'Невірний токен. Відкрий «Налаштування» і перевір його.',
    token_not_set: 'У Code.gs не змінено TOKEN.',
    bad_request: 'Сервер не зрозумів запит.'
  };
  const MONTHS = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня',
                  'вересня', 'жовтня', 'листопада', 'грудня'];
  const MONTHS_NOM = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень',
                      'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];

  // ---------- Допоміжне ----------
  function load(key, def) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; }
    catch (e) { return def; }
  }
  function save(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* сховище недоступне */ }
  }
  const pad = n => String(n).padStart(2, '0');
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // Тривалість у годинах і хвилинах (секунди відкидаються): 03:07
  function hm(ms) {
    const m = Math.floor(Math.max(0, ms) / 60000);
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  }
  // Те саме, але без нуля попереду годин (для тісних клітинок календаря): 3:07
  function hmShort(ms) {
    const m = Math.floor(Math.max(0, ms) / 60000);
    return Math.floor(m / 60) + ':' + pad(m % 60);
  }
  function clock(ms) { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function shortDate(ms) { const d = new Date(ms); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); }
  function toInput(ms) { return keyOf(new Date(ms)) + 'T' + clock(ms); }
  function fromInput(str) { return new Date(str).getTime(); }
  function dayWord(n) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'день';
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'дні';
    return 'днів';
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }
  function rateNow() { return cfg && cfg.rate > 0 ? cfg.rate : 0; }
  function money(ms) {
    const v = Math.round(ms / 3600000 * rateNow() * 100) / 100;
    return v.toLocaleString('uk-UA', { maximumFractionDigits: 2 }) + ' ₴';
  }

  // ---------- Дані ----------
  let cfg = load(LS.cfg, null);
  let queue = load(LS.queue, []);
  // зміни з сервера: [{ id, s: початок_мс, e: кінець_мс | null }]
  let shifts = load(LS.shifts, null);
  if (!shifts) shifts = load(LS.oldShifts, []).map(x => ({ id: null, s: x.s, e: x.e }));
  let syncing = false;
  let lastTap = 0;
  let view = { working: false, startedAt: null };
  let lastMin = Math.floor(Date.now() / 60000);
  const now0 = new Date();
  const cal = { y: now0.getFullYear(), m: now0.getMonth() };

  // Зміни з сервера + ще не відправлені події з черги: офлайн-статистика й календар
  // одразу враховують нові приходи, уходи та правки.
  function currentShifts() {
    const list = shifts.map(x => ({ id: x.id, s: x.s, e: x.e }));
    const findOpen = () => list.filter(x => x.e == null).pop();
    queue.forEach(ev => {
      if (ev.type === 'in') {
        if (!findOpen()) list.push({ id: ev.id, s: ev.ts, e: null });
      } else if (ev.type === 'out') {
        const o = findOpen();
        if (o && ev.ts >= o.s) o.e = ev.ts;
      } else if (ev.type === 'add') {
        list.push({ id: ev.id, s: ev.s, e: ev.e });
      } else if (ev.type === 'edit') {
        const t = list.find(x => x.id === ev.sid);
        if (t) { t.s = ev.s; if (ev.e != null) t.e = ev.e; }
      } else if (ev.type === 'del') {
        const i = list.findIndex(x => x.id === ev.sid);
        if (i >= 0) list.splice(i, 1);
      }
    });
    list.sort((a, b) => a.s - b.s);
    return list;
  }
  function stateOf(list) {
    const open = list.filter(x => x.e == null).pop();
    return open ? { working: true, startedAt: open.s } : { working: false, startedAt: null };
  }

  // ---------- Статистика за періоди ----------
  function computeStats(list) {
    const now = new Date();
    const nowMs = now.getTime();
    const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    const lastDay = new Date(y, m + 1, 0).getDate();
    const back = (now.getDay() + 6) % 7; // тиждень починається з понеділка
    const monday = new Date(y, m, d - back);
    const sunday = new Date(y, m, d - back + 6);
    const mk = day => y + '-' + pad(m + 1) + '-' + pad(day);
    const short = dt => pad(dt.getDate()) + '.' + pad(dt.getMonth() + 1);

    const periods = [
      { id: 'today', label: 'Сьогодні', from: keyOf(now), to: keyOf(now) },
      { id: 'week', label: 'Тиждень', hint: short(monday) + ' – ' + short(sunday), from: keyOf(monday), to: keyOf(sunday) },
      { id: 'h1', label: '1–15 ' + MONTHS[m], from: mk(1), to: mk(15) }
    ];
    if (d >= 16) periods.push({ id: 'h2', label: '16–' + lastDay + ' ' + MONTHS[m], from: mk(16), to: mk(lastDay) });
    periods.push({ id: 'month', label: MONTHS_NOM[m], hint: String(y), from: mk(1), to: mk(lastDay) });
    periods.forEach(p => { p.ms = 0; p.days = new Set(); });

    list.forEach(sh => {
      const key = keyOf(new Date(sh.s)); // зміна належить дню, коли вона почалась
      const dur = Math.max(0, (sh.e == null ? nowMs : sh.e) - sh.s);
      periods.forEach(p => {
        if (key >= p.from && key <= p.to) { p.ms += dur; p.days.add(key); }
      });
    });
    return periods;
  }

  function renderStats(list) {
    const periods = computeStats(list);
    todayLineEl.textContent = 'Сьогодні: ' + hm(periods[0].ms) + (rateNow() ? ' · ' + money(periods[0].ms) : '');
    statsEl.innerHTML = periods.map(p =>
      '<div class="row' + (p.id === 'today' ? ' main' : '') + '">' +
        '<div class="lbl">' + p.label + (p.hint ? '<small>' + p.hint + '</small>' : '') + '</div>' +
        '<div class="val">' + hm(p.ms) + (rateNow() ? '<small>' + money(p.ms) + '</small>' : '') + '</div>' +
        '<div class="days">' + p.days.size + ' ' + dayWord(p.days.size) + '</div>' +
      '</div>'
    ).join('');
  }

  // ---------- Календар ----------
  function renderCalendar(list) {
    const nowD = new Date(), nowMs = nowD.getTime();
    const first = new Date(cal.y, cal.m, 1);
    const lastDay = new Date(cal.y, cal.m + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    const todayKey = keyOf(nowD);

    const perDay = {};
    list.forEach(sh => {
      const d = new Date(sh.s);
      if (d.getFullYear() !== cal.y || d.getMonth() !== cal.m) return;
      const k = keyOf(d);
      const o = perDay[k] || (perDay[k] = { ms: 0, open: false });
      o.ms += Math.max(0, (sh.e == null ? nowMs : sh.e) - sh.s);
      if (sh.e == null) o.open = true;
    });

    let html = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(w => '<div class="wd">' + w + '</div>').join('');
    for (let i = 0; i < lead; i++) html += '<div class="day blank"></div>';
    let total = 0, days = 0;
    for (let day = 1; day <= lastDay; day++) {
      const key = cal.y + '-' + pad(cal.m + 1) + '-' + pad(day);
      const o = perDay[key];
      let style = '', label = '';
      if (o) {
        total += o.ms;
        days++;
        const alpha = o.open ? 0.5 : Math.min(1, o.ms / 3600000 / 8) * 0.5 + 0.15;
        style = ' style="background:' + (o.open ? 'rgba(229,72,63,' : 'rgba(47,179,106,') + alpha.toFixed(2) + ')"';
        label = hmShort(o.ms);
      }
      html += '<button type="button" class="day' + (key === todayKey ? ' today' : '') +
        '" data-key="' + key + '"' + style + '><span class="n">' + day + '</span><span class="h">' + label + '</span></button>';
    }
    calGridEl.innerHTML = html;
    calTitleEl.textContent = MONTHS_NOM[cal.m] + ' ' + cal.y;
    calSummaryEl.textContent = days
      ? 'Разом: ' + hmShort(total) + ' · ' + days + ' ' + dayWord(days) + (rateNow() ? ' · ' + money(total) : '')
      : 'У цьому місяці змін немає';

    const earliest = list.length ? Math.min.apply(null, list.map(x => x.s)) : Infinity;
    $('calPrev').disabled = !(earliest < first.getTime());
    $('calNext').disabled = (cal.y * 12 + cal.m) >= (nowD.getFullYear() * 12 + nowD.getMonth());
  }
  $('calPrev').addEventListener('click', () => {
    cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; }
    renderCalendar(currentShifts());
  });
  $('calNext').addEventListener('click', () => {
    cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; }
    renderCalendar(currentShifts());
  });
  calGridEl.addEventListener('click', ev => {
    const b = ev.target.closest('.day[data-key]');
    if (b) openDay(b.dataset.key);
  });

  // ---------- Головне відображення ----------
  function render() {
    const list = currentShifts();
    view = stateOf(list);
    btn.classList.toggle('working', view.working);
    btn.textContent = view.working ? 'Піти з роботи' : 'Прийшов на роботу';
    statusEl.textContent = view.working ? 'Ти на роботі з ' + clock(view.startedAt) : 'Ти не на роботі';
    renderStats(list);
    renderCalendar(list);
    setTimer();
    renderSync();
    if (dayDlg.open) renderDay(list);
  }
  function setTimer() {
    timerEl.textContent = view.working && view.startedAt ? hm(Date.now() - view.startedAt) : '';
  }
  function renderSync() {
    let text, pending = false;
    if (!cfg) { text = 'Застосунок не підключено до таблиці'; pending = true; }
    else if (queue.length) {
      text = 'Очікує відправки: ' + queue.length + (navigator.onLine ? '' : ' · немає мережі');
      pending = true;
    }
    else if (syncing) text = 'Синхронізація…';
    else text = navigator.onLine ? 'Синхронізовано' : 'Немає мережі';
    syncEl.textContent = text;
    syncEl.classList.toggle('pending', pending);
  }
  function note(text, isError) {
    noteEl.textContent = text || '';
    noteEl.classList.toggle('error', !!isError);
  }

  // ---------- Мережа ----------
  async function post(body) {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 25000);
    let res;
    try {
      res = await fetch(cfg.url, {
        method: 'POST',
        // text/plain — «простий» запит без preflight, інакше Apps Script його не прийме
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ token: cfg.token }, body)),
        signal: ctrl.signal
      });
    } catch (e) {
      const err = new Error('network');
      err.network = true;
      throw err;
    } finally {
      clearTimeout(timeout);
    }
    let data;
    try { data = await res.json(); }
    catch (e) {
      throw new Error('Сервер повернув некоректну відповідь. Перевір адресу та те, що доступ у розгортанні — «Усі».');
    }
    if (!data.ok) throw new Error(ERRORS[data.error] || 'Помилка сервера: ' + data.error);
    return data;
  }

  function applyServer(s) {
    if (queue.length) return; // є непереслані дії — локальні дані важливіші
    shifts = (s.shifts || []).map(x => x.length === 2
      ? { id: null, s: x[0], e: x[1] || null }          // відповідь старого сервера
      : { id: x[0], s: x[1], e: x[2] || null });
    save(LS.shifts, shifts);
    render();
  }

  async function sync() {
    if (syncing || !cfg) return;
    syncing = true;
    renderSync();
    let clean = false;
    try {
      while (queue.length) {
        const ev = queue[0];
        const data = await post(Object.assign({ action: 'event' }, ev));
        queue.shift();
        save(LS.queue, queue);
        if (NOTES[data.result]) note(NOTES[data.result], false);
        renderSync();
      }
      const data = await post({ action: 'state' });
      applyServer(data.state);
      clean = true;
    } catch (e) {
      if (!e.network) note(e.message, true);
    } finally {
      syncing = false;
      renderSync();
      if (clean && queue.length) setTimeout(sync, 200); // нажали, поки йшла синхронізація
    }
  }

  function commit(ev) {
    queue.push(ev);
    save(LS.queue, queue);
    note('');
    render();
    sync();
  }

  // ---------- Кнопка ----------
  btn.addEventListener('click', () => {
    if (!cfg) { openSettings(); return; }
    const now = Date.now();
    if (now - lastTap < 2000) return; // захист від випадкового подвійного дотику
    lastTap = now;
    btn.disabled = true;
    setTimeout(() => { btn.disabled = false; }, 2000);
    if (navigator.vibrate) navigator.vibrate(40);
    commit({ id: uuid(), type: view.working ? 'out' : 'in', ts: now });
  });

  // ---------- Вкладки ----------
  function showTab(name) {
    const isTrack = name === 'track';
    $('viewTrack').classList.toggle('active', isTrack);
    $('viewStats').classList.toggle('active', !isTrack);
    $('tabTrack').setAttribute('aria-selected', String(isTrack));
    $('tabStats').setAttribute('aria-selected', String(!isTrack));
  }
  $('tabTrack').addEventListener('click', () => showTab('track'));
  $('tabStats').addEventListener('click', () => showTab('stats'));

  // ---------- День: список змін ----------
  let daySel = null;
  let dayShifts = [];

  function openDay(key) {
    daySel = key;
    renderDay(currentShifts());
    dayDlg.showModal();
  }
  function renderDay(list) {
    const p = daySel.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    $('dayTitle').textContent = d.toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
    dayShifts = list.filter(x => keyOf(new Date(x.s)) === daySel);
    if (!dayShifts.length) {
      $('dayList').innerHTML = '<div class="empty">Змін немає</div>';
      return;
    }
    const nowMs = Date.now();
    let total = 0;
    let html = dayShifts.map((x, i) => {
      const dur = Math.max(0, (x.e == null ? nowMs : x.e) - x.s);
      total += dur;
      const end = x.e == null ? '…' : clock(x.e) + (keyOf(new Date(x.e)) !== daySel ? ' (' + shortDate(x.e) + ')' : '');
      return '<div class="shiftRow"><div>' +
        '<div class="t">' + clock(x.s) + ' – ' + end + '</div>' +
        '<div class="m">' + hm(dur) + (x.e == null ? ' · триває' : '') + (rateNow() ? ' · ' + money(dur) : '') + '</div>' +
        '</div><button type="button" class="editBtn" data-idx="' + i + '">Змінити</button></div>';
    }).join('');
    if (dayShifts.length > 1) {
      html += '<div class="totalRow">Разом за день: ' + hm(total) + (rateNow() ? ' · ' + money(total) : '') + '</div>';
    }
    $('dayList').innerHTML = html;
  }
  $('dayList').addEventListener('click', ev => {
    const b = ev.target.closest('.editBtn');
    if (b) openEdit('edit', dayShifts[Number(b.dataset.idx)]);
  });
  $('dayAdd').addEventListener('click', () => openEdit('add', null));
  $('dayClose').addEventListener('click', () => dayDlg.close());

  // ---------- Правка / додавання зміни ----------
  let editCtx = null;

  function openEdit(mode, shift) {
    if (!cfg) { openSettings(); return; }
    $('editError').textContent = '';
    if (mode === 'add') {
      const p = daySel.split('-').map(Number);
      const nowMs = Date.now();
      let e = new Date(p[0], p[1] - 1, p[2], 18, 0).getTime();
      if (e > nowMs) e = Math.floor(nowMs / 60000) * 60000;
      let s = new Date(p[0], p[1] - 1, p[2], 9, 0).getTime();
      if (s >= e) s = e - 3600000;
      editCtx = { mode: 'add', shift: null };
      $('editTitle').textContent = 'Нова зміна';
      $('editStart').value = toInput(s);
      $('editEnd').value = toInput(e);
      $('editHint').textContent = '';
      $('editDelete').hidden = true;
    } else {
      if (!shift || !shift.id) {
        note('Цю зміну ще не синхронізовано з таблицею. Спробуй після синхронізації.', false);
        return;
      }
      editCtx = { mode: 'edit', shift: shift };
      $('editTitle').textContent = 'Змінити зміну';
      $('editStart').value = toInput(shift.s);
      $('editEnd').value = shift.e == null ? '' : toInput(shift.e);
      $('editHint').textContent = shift.e == null
        ? 'Зміна ще триває. Вкажи «Кінець», щоб закрити її, або залиш порожнім.'
        : '';
      $('editDelete').hidden = false;
    }
    editDlg.showModal();
  }

  $('editCancel').addEventListener('click', () => editDlg.close());

  $('editSave').addEventListener('click', () => {
    const fail = msg => { $('editError').textContent = msg; };
    const s = fromInput($('editStart').value);
    const eRaw = $('editEnd').value;
    const e = eRaw ? fromInput(eRaw) : null;
    const nowMs = Date.now();
    const limit = nowMs + FUTURE_MS;
    const isOpenShift = editCtx.mode === 'edit' && editCtx.shift.e == null;

    if (!isFinite(s)) return fail('Вкажи час початку.');
    if (e === null && !isOpenShift) return fail('Вкажи час завершення.');
    if (e !== null && !isFinite(e)) return fail('Некоректний час завершення.');
    if (e !== null && e <= s) return fail('Завершення має бути пізніше за початок.');
    if (s > limit || (e !== null && e > limit)) return fail('Час не може бути в майбутньому.');

    const ignore = editCtx.mode === 'edit' ? editCtx.shift.id : undefined;
    const endEff = e === null ? Math.max(nowMs, s + 1) : e;
    const clash = currentShifts().find(x =>
      x.id !== ignore && s < (x.e == null ? nowMs : x.e) && endEff > x.s);
    if (clash) {
      return fail('Перетинається зі зміною ' + clock(clash.s) + ' – ' +
        (clash.e == null ? '…' : clock(clash.e)) + ' (' + shortDate(clash.s) + ').');
    }

    const dur = endEff - s;
    if (dur > 16 * 3600000 && !window.confirm('Тривалість зміни ' + hm(dur) + '. Зберегти?')) return;

    editDlg.close();
    if (editCtx.mode === 'add') commit({ id: uuid(), type: 'add', s: s, e: e });
    else commit({ id: uuid(), type: 'edit', sid: editCtx.shift.id, s: s, e: e });
  });

  $('editDelete').addEventListener('click', () => {
    if (!window.confirm('Видалити цю зміну?')) return;
    editDlg.close();
    commit({ id: uuid(), type: 'del', sid: editCtx.shift.id });
  });

  // ---------- Налаштування ----------
  function openSettings() {
    $('cfgUrl').value = cfg ? cfg.url : '';
    $('cfgToken').value = cfg ? cfg.token : '';
    $('cfgRate').value = cfg && cfg.rate ? String(cfg.rate) : '';
    $('cfgError').textContent = '';
    dlg.showModal();
  }
  $('settingsBtn').addEventListener('click', openSettings);
  $('cfgCancel').addEventListener('click', () => dlg.close());
  $('cfgSave').addEventListener('click', () => {
    const url = $('cfgUrl').value.trim();
    const token = $('cfgToken').value.trim();
    const rateRaw = $('cfgRate').value.trim().replace(',', '.');
    const rate = rateRaw === '' ? 0 : Number(rateRaw);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) {
      $('cfgError').textContent = 'Адреса має мати вигляд https://script.google.com/macros/s/…/exec';
      return;
    }
    if (!token) { $('cfgError').textContent = 'Введи токен.'; return; }
    if (!isFinite(rate) || rate < 0) { $('cfgError').textContent = 'Вартість години має бути числом, наприклад 150 або 150.50.'; return; }
    cfg = { url: url, token: token, rate: rate };
    save(LS.cfg, cfg);
    note('');
    dlg.close();
    render();
    sync();
  });

  // ---------- Запуск ----------
  window.addEventListener('online', () => { renderSync(); sync(); });
  window.addEventListener('offline', renderSync);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { render(); sync(); }
  });
  setInterval(() => {
    setTimer();
    const mk = Math.floor(Date.now() / 60000);
    if (mk !== lastMin) { lastMin = mk; render(); } // раз на хвилину оновлюємо цифри (і дату опівночі)
  }, 1000);
  setInterval(() => { if (queue.length) sync(); }, 30000);

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  render();
  if (!cfg) openSettings(); else sync();
})();
</script>
</body>
</html>
